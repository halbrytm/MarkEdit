<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' markedit:; style-src 'self' markedit: 'unsafe-inline'; font-src 'self' markedit: data:; img-src * data: blob:; media-src *; connect-src 'self'">
<title>MarkEdit</title>
<link rel="stylesheet" href="vendor/cm/codemirror.css">
<link rel="stylesheet" href="vendor/cm/addon/dialog.css">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="vendor/hljs-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/hljs-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="app.css">
</head>
<body data-mode="split">

<div id="banner" hidden>
  <span class="banner-icon">⚠︎</span>
  <span id="banner-text"></span>
  <span class="banner-actions" id="banner-actions"></span>
</div>

<div id="formatbar" role="toolbar" aria-label="Formatowanie">
  <div class="fb-group">
    <button class="fb-btn fb-glyph" data-cmd="bold" title="Pogrubienie (⌘B)"><b>B</b></button>
    <button class="fb-btn fb-glyph" data-cmd="italic" title="Kursywa (⌘I)"><i>I</i></button>
    <button class="fb-btn fb-glyph" data-cmd="strike" title="Przekreślenie"><s>S</s></button>
    <button class="fb-btn fb-glyph fb-mono" data-cmd="code" title="Kod w linii">&lt;/&gt;</button>
  </div>
  <div class="fb-sep"></div>
  <div class="fb-group">
    <select id="fb-heading" title="Nagłówek">
      <option value="0">Akapit</option>
      <option value="1">Nagłówek 1</option>
      <option value="2">Nagłówek 2</option>
      <option value="3">Nagłówek 3</option>
      <option value="4">Nagłówek 4</option>
      <option value="5">Nagłówek 5</option>
      <option value="6">Nagłówek 6</option>
    </select>
  </div>
  <div class="fb-sep"></div>
  <div class="fb-group">
    <button class="fb-btn fb-glyph" data-cmd="quote" title="Cytat">”</button>
    <button class="fb-btn fb-glyph fb-mono" data-cmd="codeblock" title="Blok kodu">{ }</button>
  </div>
  <div class="fb-sep"></div>
  <div class="fb-group">
    <button class="fb-btn" data-cmd="ul" title="Lista punktowana"><svg viewBox="0 0 18 18"><circle cx="2.5" cy="4.5" r="1.3" fill="currentColor" stroke="none"/><circle cx="2.5" cy="9" r="1.3" fill="currentColor" stroke="none"/><circle cx="2.5" cy="13.5" r="1.3" fill="currentColor" stroke="none"/><line x1="6.5" y1="4.5" x2="16" y2="4.5"/><line x1="6.5" y1="9" x2="16" y2="9"/><line x1="6.5" y1="13.5" x2="16" y2="13.5"/></svg></button>
    <button class="fb-btn" data-cmd="ol" title="Lista numerowana"><svg viewBox="0 0 18 18"><text x="0.3" y="6.3" font-size="5.6" font-family="ui-monospace,monospace" fill="currentColor" stroke="none">1.</text><text x="0.3" y="10.8" font-size="5.6" font-family="ui-monospace,monospace" fill="currentColor" stroke="none">2.</text><text x="0.3" y="15.3" font-size="5.6" font-family="ui-monospace,monospace" fill="currentColor" stroke="none">3.</text><line x1="6.5" y1="4.5" x2="16" y2="4.5"/><line x1="6.5" y1="9" x2="16" y2="9"/><line x1="6.5" y1="13.5" x2="16" y2="13.5"/></svg></button>
    <button class="fb-btn" data-cmd="task" title="Lista zadań"><svg viewBox="0 0 18 18"><rect x="1.2" y="3.2" width="4.6" height="4.6" rx="1"/><path d="M2.3 5.5l1 1 2-2.2"/><line x1="8.5" y1="5.5" x2="16" y2="5.5"/><rect x="1.2" y="10.2" width="4.6" height="4.6" rx="1"/><line x1="8.5" y1="12.5" x2="16" y2="12.5"/></svg></button>
    <button class="fb-btn" data-cmd="outdent" title="Zmniejsz wcięcie"><svg viewBox="0 0 18 18"><line x1="2" y1="3" x2="16" y2="3"/><line x1="2" y1="9" x2="10" y2="9"/><line x1="2" y1="15" x2="16" y2="15"/><path d="M5.5 6.5L2 9l3.5 2.5"/></svg></button>
    <button class="fb-btn" data-cmd="indent" title="Zwiększ wcięcie"><svg viewBox="0 0 18 18"><line x1="2" y1="3" x2="16" y2="3"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="2" y1="15" x2="16" y2="15"/><path d="M2 6.5l3.5 2.5-3.5 2.5"/></svg></button>
  </div>
  <div class="fb-sep"></div>
  <div class="fb-group">
    <button class="fb-btn" data-cmd="link" title="Link"><svg viewBox="0 0 18 18"><path d="M7 11L11 7"/><path d="M9.5 4.5l1-1a3 3 0 0 1 4.2 4.2l-1.4 1.4"/><path d="M8.5 13.5l-1 1a3 3 0 0 1-4.2-4.2l1.4-1.4"/></svg></button>
    <button class="fb-btn" data-cmd="image" title="Obraz"><svg viewBox="0 0 18 18"><rect x="1.5" y="2.5" width="15" height="13" rx="1.5"/><circle cx="6" cy="7" r="1.6" fill="currentColor" stroke="none"/><path d="M2 13.5l4.5-4.5 3 3 2.5-2.5 4 4"/></svg></button>
    <button class="fb-btn" data-cmd="table" title="Tabela"><svg viewBox="0 0 18 18"><rect x="1.5" y="2.5" width="15" height="13" rx="1.2"/><line x1="1.5" y1="7" x2="16.5" y2="7"/><line x1="1.5" y1="11.5" x2="16.5" y2="11.5"/><line x1="6.5" y1="2.5" x2="6.5" y2="15.5"/><line x1="11.5" y1="2.5" x2="11.5" y2="15.5"/></svg></button>
    <button class="fb-btn" data-cmd="hr" title="Linia pozioma"><svg viewBox="0 0 18 18"><line x1="2" y1="9" x2="16" y2="9" stroke-width="2.2"/></svg></button>
  </div>
</div>

<div id="main">
  <div id="raw-pane"></div>
  <div id="divider" title="Przeciągnij, aby zmienić proporcje (dwuklik: 50/50)"></div>
  <div id="preview-pane">
    <article id="preview" class="markdown-body" contenteditable="true" spellcheck="true"
             data-placeholder="Pusty dokument — zacznij pisać tutaj albo po lewej."></article>
  </div>
  <div id="findbar" hidden>
      <input id="find-input" type="search" placeholder="Szukaj w podglądzie" spellcheck="false">
      <span id="find-count"></span>
      <button id="find-prev" title="Poprzednie (⇧⏎)">‹</button>
      <button id="find-next" title="Następne (⏎)">›</button>
      <button id="find-close" title="Zamknij (Esc)">✕</button>
  </div>
</div>

<div id="toast" hidden></div>

<div id="diff-modal" hidden>
  <div class="diff-box">
    <header>
      <strong>Różnice: Twoja wersja ↔ wersja na dysku</strong>
      <span class="legend"><span class="del">− tylko u Ciebie</span> <span class="ins">+ tylko na dysku</span></span>
    </header>
    <div id="diff-body"></div>
    <footer>
      <button data-choice="close">Zamknij</button>
      <button data-choice="disk">Wczytaj z dysku</button>
      <button data-choice="mine" class="primary">Zachowaj moją wersję</button>
    </footer>
  </div>
</div>

<script src="vendor/cm/codemirror.js"></script>
<script src="vendor/cm/addon/overlay.js"></script>
<script src="vendor/cm/addon/simple.js"></script>
<script src="vendor/cm/mode/xml.js"></script>
<script src="vendor/cm/mode/javascript.js"></script>
<script src="vendor/cm/mode/css.js"></script>
<script src="vendor/cm/mode/htmlmixed.js"></script>
<script src="vendor/cm/mode/python.js"></script>
<script src="vendor/cm/mode/shell.js"></script>
<script src="vendor/cm/mode/yaml.js"></script>
<script src="vendor/cm/mode/clike.js"></script>
<script src="vendor/cm/mode/go.js"></script>
<script src="vendor/cm/mode/rust.js"></script>
<script src="vendor/cm/mode/sql.js"></script>
<script src="vendor/cm/mode/markdown.js"></script>
<script src="vendor/cm/mode/gfm.js"></script>
<script src="vendor/cm/mode/yaml-frontmatter.js"></script>
<script src="vendor/cm/addon/continuelist.js"></script>
<script src="vendor/cm/addon/dialog.js"></script>
<script src="vendor/cm/addon/searchcursor.js"></script>
<script src="vendor/cm/addon/search.js"></script>
<script src="vendor/cm/addon/active-line.js"></script>
<script src="vendor/cm/addon/closebrackets.js"></script>
<script src="vendor/markdown-it.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/turndown.js"></script>
<script src="vendor/turndown-plugin-gfm.js"></script>
<script src="app.js"></script>
</body>
</html>
